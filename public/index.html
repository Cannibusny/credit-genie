<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Genie — Adaptive Credit Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0B1120;--bg2:#111827;--bg3:#1F2937;--border:#374151;
  --text:#E5E7EB;--text2:#9CA3AF;--accent:#60A5FA;--green:#34D399;
  --red:#F87171;--orange:#FBBF24;--purple:#A78BFA;
  --font:'IBM Plex Mono',monospace;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;line-height:1.5}
button{font-family:var(--font);cursor:pointer;border:1px solid var(--border);background:var(--bg3);color:var(--text);padding:8px 16px;font-size:12px;transition:all .15s}
button:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
button.primary:hover{background:#93C5FD}
button.danger{border-color:var(--red);color:var(--red)}
button.danger:hover{background:var(--red);color:var(--bg)}
input,select,textarea{font-family:var(--font);background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 12px;font-size:12px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
label{display:block;margin-bottom:4px;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.card{background:var(--bg2);border:1px solid var(--border);padding:16px;margin-bottom:12px}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.badge{padding:2px 8px;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;border:1px solid}
.badge.critical{color:var(--red);border-color:var(--red)}
.badge.high{color:var(--orange);border-color:var(--orange)}
.badge.medium{color:var(--accent);border-color:var(--accent)}
.badge.low{color:var(--text2);border-color:var(--border)}
h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
h2{font-size:15px;font-weight:600;letter-spacing:-0.3px}
h3{font-size:13px;font-weight:600}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.mt-12{margin-top:12px}.mt-8{margin-top:8px}.mb-8{margin-bottom:8px}

/* Layout */
#app{display:flex;flex-direction:column;height:100vh}
nav{display:flex;align-items:center;border-bottom:1px solid var(--border);padding:0 16px;height:48px;flex-shrink:0}
nav .logo{font-weight:700;font-size:14px;color:var(--accent);margin-right:24px;white-space:nowrap}
nav .tabs{display:flex;gap:0;overflow-x:auto}
nav .tab{padding:12px 16px;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav .tab:hover{color:var(--text)}
nav .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
nav .tier{margin-left:auto;padding:4px 10px;border:1px solid var(--accent);font-size:10px;color:var(--accent);text-transform:uppercase}
main{flex:1;overflow-y:auto;padding:20px}

/* Onboarding */
#onboarding{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center}
#onboarding .screen{max-width:520px;width:100%;padding:40px}
#onboarding h1{font-size:24px;margin-bottom:16px;line-height:1.3}
#onboarding p{color:var(--text2);margin-bottom:20px;font-size:14px;line-height:1.6}
#onboarding .state-alert{background:var(--bg2);border:1px solid var(--green);padding:12px;color:var(--green);margin:16px 0;font-size:12px}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal-btn{padding:20px;text-align:center;border:1px solid var(--border);background:var(--bg2);cursor:pointer;font-size:13px}
.goal-btn:hover,.goal-btn.selected{border-color:var(--accent);color:var(--accent)}

/* Score gauges */
.score-display{display:flex;gap:24px;justify-content:center;margin:20px 0}
.score-gauge{text-align:center}
.score-gauge .number{font-size:32px;font-weight:700}
.score-gauge .label{font-size:11px;color:var(--text2);text-transform:uppercase;margin-top:4px}
.score-gauge.good .number{color:var(--green)}
.score-gauge.fair .number{color:var(--orange)}
.score-gauge.poor .number{color:var(--red)}

/* Advisory feed */
.advisory-item{border-left:3px solid var(--border);padding:12px 16px;margin-bottom:8px;background:var(--bg2)}
.advisory-item.critical{border-left-color:var(--red)}
.advisory-item.high{border-left-color:var(--orange)}
.advisory-item.medium{border-left-color:var(--accent)}
.advisory-item .condition{color:var(--text2);font-size:11px;margin-bottom:4px}
.advisory-item .action{font-weight:600;margin-bottom:4px}
.advisory-item .impact{color:var(--green);font-size:11px}
.advisory-item .meta{display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--text2)}

/* Module result */
.module-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.module-header .icon{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--accent);color:var(--accent);font-size:14px}
.stat-row{display:flex;gap:24px;margin:16px 0;flex-wrap:wrap}
.stat-box{background:var(--bg2);border:1px solid var(--border);padding:12px 16px;min-width:120px}
.stat-box .value{font-size:20px;font-weight:700;color:var(--accent)}
.stat-box .label{font-size:10px;color:var(--text2);text-transform:uppercase;margin-top:4px}

/* Calendar */
.calendar-month{margin-bottom:16px}
.calendar-month h3{margin-bottom:8px;color:var(--accent)}
.calendar-entry{display:flex;align-items:center;gap:12px;padding:8px;background:var(--bg);margin-bottom:4px;font-size:11px}
.calendar-entry .dot{width:8px;height:8px;border-radius:0;background:var(--accent)}
.calendar-entry.sent .dot{background:var(--green)}
.calendar-entry.completed .dot{background:var(--green)}

/* Form */
.form-row{margin-bottom:12px}
.form-row.inline{display:flex;gap:12px}
.form-row.inline>*{flex:1}

/* Scan animation */
.scan-progress{margin:20px 0}
.scan-line{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:12px;opacity:0.3;transition:opacity 0.5s}
.scan-line.active{opacity:1}
.scan-line.done{opacity:1;color:var(--green)}
.scan-line .check{color:var(--green)}
</style>
</head>
<body>
<div id="app">
  <!-- Onboarding overlay -->
  <div id="onboarding">
    <div class="screen" id="screen-1">
      <h1>Most credit repair tools show you problems.</h1>
      <p>Credit Genie tells you exactly what to do next — and what it will cost you if you don't.</p>
      <button class="primary" onclick="nextScreen(2)">Show me mine</button>
    </div>
  </div>

  <!-- Main app (hidden until onboarding complete) -->
  <nav id="main-nav" style="display:none">
    <span class="logo">CREDIT GENIE</span>
    <div class="tabs">
      <div class="tab active" data-tab="dashboard">Dashboard</div>
      <div class="tab" data-tab="import">Import</div>
      <div class="tab" data-tab="profile">Profile</div>
      <div class="tab" data-tab="optimizer">Optimizer</div>
      <div class="tab" data-tab="disputes">Disputes</div>
      <div class="tab" data-tab="collections">Collections</div>
      <div class="tab" data-tab="medical">Medical</div>
      <div class="tab" data-tab="monitor">Monitor</div>
      <div class="tab" data-tab="documents">Documents</div>
    </div>
    <span class="tier" id="tier-badge">FREE</span>
  </nav>
  <main id="main-content" style="display:none"></main>
</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let currentProfile = null;
let advisories = [];
let scanResults = null;

// ─── Onboarding ─────────────────────────────────────────────────────────────
function nextScreen(num) {
  const ob = document.getElementById('onboarding');
  if (num === 2) {
    ob.innerHTML = `<div class="screen" id="screen-2">
      <h1>Let's get started</h1>
      <p>We just need your name and state. No SSN required.</p>
      <div class="form-row"><label>First Name</label><input id="ob-first" placeholder="First name"></div>
      <div class="form-row"><label>Last Name</label><input id="ob-last" placeholder="Last name"></div>
      <div class="form-row"><label>Email</label><input id="ob-email" type="email" placeholder="email@example.com"></div>
      <div class="form-row inline">
        <div><label>State</label><input id="ob-state" placeholder="NY" maxlength="2"></div>
        <div><label>County</label><input id="ob-county" placeholder="Orange"></div>
      </div>
      <div id="state-alert" class="state-alert" style="display:none"></div>
      <button class="primary mt-12" onclick="submitIdentity()">Continue</button>
    </div>`;
    document.getElementById('ob-state').addEventListener('input', (e) => {
      const val = e.target.value.toUpperCase();
      const alert = document.getElementById('state-alert');
      if (val === 'NY') {
        alert.style.display = 'block';
        alert.textContent = 'Good news: New York has banned medical debt from credit reports. We will check yours automatically.';
      } else if (val === 'CO') {
        alert.style.display = 'block';
        alert.textContent = 'Colorado restricts medical debt reporting for debts under $500 and debts less than 6 months old.';
      } else {
        alert.style.display = 'none';
      }
    });
  } else if (num === 6) {
    ob.innerHTML = `<div class="screen" id="screen-6">
      <h1>What are you working toward?</h1>
      <p>This determines which modules get prioritized.</p>
      <div class="goal-grid">
        <div class="goal-btn" onclick="selectGoal('buying_home',this)">Buying a home</div>
        <div class="goal-btn" onclick="selectGoal('business_financing',this)">Business loan / financing</div>
        <div class="goal-btn" onclick="selectGoal('renting_apartment',this)">Renting an apartment</div>
        <div class="goal-btn" onclick="selectGoal('better_score',this)">Just want a better score</div>
      </div>
      <button class="primary mt-12" onclick="finishOnboarding()">Run My Scan</button>
    </div>`;
  }
}

async function submitIdentity() {
  const firstName = document.getElementById('ob-first').value.trim();
  const lastName = document.getElementById('ob-last').value.trim();
  const email = document.getElementById('ob-email').value.trim();
  const state = document.getElementById('ob-state').value.trim().toUpperCase();
  const county = document.getElementById('ob-county').value.trim();
  if (!firstName || !lastName || !state) { alert('Name and state required'); return; }

  const res = await fetch('/api/profiles', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ firstName, lastName, email, state, county })
  });
  currentProfile = await res.json();
  nextScreen(6);
}

let selectedGoal = 'better_score';
function selectGoal(goal, el) {
  selectedGoal = goal;
  document.querySelectorAll('.goal-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

async function finishOnboarding() {
  // Update profile with goal
  await fetch(`/api/profiles/${currentProfile.id}`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ goal: selectedGoal })
  });
  currentProfile.goal = selectedGoal;

  // Show scan screen
  const ob = document.getElementById('onboarding');
  ob.innerHTML = `<div class="screen" id="screen-4">
    <h1>Scanning your credit intelligence...</h1>
    <div class="scan-progress">
      <div class="scan-line" id="sl-1">▸ Payment History</div>
      <div class="scan-line" id="sl-2">▸ Utilization & Report Dates</div>
      <div class="scan-line" id="sl-3">▸ Collections & Medical Debt</div>
      <div class="scan-line" id="sl-4">▸ Mixed Files & Duplicates</div>
      <div class="scan-line" id="sl-5">▸ Authorized User Accounts</div>
      <div class="scan-line" id="sl-6">▸ Account Age & Credit Mix</div>
      <div class="scan-line" id="sl-7">▸ Dormant Card Risk</div>
      <div class="scan-line" id="sl-8">▸ Bureau Behavior Analysis</div>
    </div>
    <p style="color:var(--text2);font-size:11px">Add accounts and scores from the Profile tab to get a full analysis.</p>
  </div>`;

  // Animate scan lines
  for (let i = 1; i <= 8; i++) {
    await new Promise(r => setTimeout(r, 400));
    const el = document.getElementById(`sl-${i}`);
    if (el) { el.classList.add('active'); }
    await new Promise(r => setTimeout(r, 300));
    if (el) { el.classList.add('done'); el.innerHTML = '✓ ' + el.textContent.slice(2); }
  }

  await new Promise(r => setTimeout(r, 500));

  // Run actual scan
  const scanRes = await fetch(`/api/modules/${currentProfile.id}/scan`, { method: 'POST' });
  scanResults = await scanRes.json();
  advisories = scanResults.advisories || [];

  // Complete onboarding — show main app
  ob.style.display = 'none';
  document.getElementById('main-nav').style.display = 'flex';
  document.getElementById('main-content').style.display = 'block';
  renderDashboard();
}

// ─── Navigation ─────────────────────────────────────────────────────────────
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    const tab = e.target.dataset.tab;
    if (tab === 'dashboard') renderDashboard();
    else if (tab === 'import') renderImport();
    else if (tab === 'profile') renderProfile();
    else if (tab === 'optimizer') renderOptimizer();
    else if (tab === 'disputes') renderDisputes();
    else if (tab === 'collections') renderCollections();
    else if (tab === 'medical') renderMedical();
    else if (tab === 'monitor') renderMonitor();
    else if (tab === 'documents') renderDocuments();
  }
});

// ─── Import Tab ─────────────────────────────────────────────────────────────
function renderImport() {
  const m = document.getElementById('main-content');
  m.innerHTML = `
    <div class="module-header"><div class="icon">↑</div><div><h2>IMPORT CREDIT REPORT</h2><span style="color:var(--text2);font-size:11px">Paste text or upload PDF — we parse it automatically</span></div></div>

    <div class="card">
      <h3>Option 1: Paste Report Text</h3>
      <p style="color:var(--text2);font-size:11px;margin:8px 0">Copy your entire credit report from AnnualCreditReport.com, Experian, TransUnion, or Equifax and paste it below.</p>
      <div class="form-row">
        <label>Bureau</label>
        <select id="import-bureau">
          <option value="equifax">Equifax</option>
          <option value="experian">Experian</option>
          <option value="transunion">TransUnion</option>
        </select>
      </div>
      <div class="form-row">
        <label>Credit Report Text</label>
        <textarea id="import-text" rows="12" placeholder="Paste your full credit report text here. Include all accounts, balances, and payment history. The more you paste, the more we can parse."></textarea>
      </div>
      <button class="primary" onclick="importText()">Parse & Import</button>
    </div>

    <div class="card">
      <h3>Option 2: Upload PDF</h3>
      <p style="color:var(--text2);font-size:11px;margin:8px 0">Upload your credit report PDF file. Supported: PDF, TXT, HTML (max 25MB).</p>
      <div class="form-row">
        <label>Bureau</label>
        <select id="import-pdf-bureau">
          <option value="equifax">Equifax</option>
          <option value="experian">Experian</option>
          <option value="transunion">TransUnion</option>
        </select>
      </div>
      <div class="form-row">
        <input type="file" id="import-file" accept=".pdf,.txt,.html" style="padding:12px;background:var(--bg2);border:1px dashed var(--border)">
      </div>
      <button class="primary" onclick="importPDF()">Upload & Parse</button>
    </div>

    <div id="import-result" style="display:none" class="card">
      <h3>Import Results</h3>
      <div id="import-result-content"></div>
    </div>

    <div class="card" style="border-color:var(--accent)">
      <h3 style="color:var(--accent)">Tips for Best Results</h3>
      <ul style="color:var(--text2);font-size:11px;padding-left:16px;line-height:2">
        <li>Download your free report from <strong>AnnualCreditReport.com</strong></li>
        <li>For text paste: Select All (Ctrl+A) on the report page, then Copy (Ctrl+C) and paste here</li>
        <li>For PDF: Save/download the report as PDF from your browser</li>
        <li>Import each bureau separately for best cross-bureau comparison</li>
        <li>The parser detects: account names, balances, limits, dates, negative items, medical debts, and AU accounts</li>
      </ul>
    </div>
  `;
}

async function importText() {
  const text = document.getElementById('import-text').value;
  const bureau = document.getElementById('import-bureau').value;
  if (!text || text.length < 50) {
    alert('Please paste more text. A credit report should be at least a few hundred characters.');
    return;
  }

  const res = await fetch(`/api/import/${currentProfile.id}/text`, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text, bureau })
  });
  const data = await res.json();
  showImportResult(data);
}

async function importPDF() {
  const fileInput = document.getElementById('import-file');
  const bureau = document.getElementById('import-pdf-bureau').value;
  if (!fileInput.files || !fileInput.files[0]) {
    alert('Please select a file to upload.');
    return;
  }

  const formData = new FormData();
  formData.append('file', fileInput.files[0]);
  formData.append('bureau', bureau);

  const res = await fetch(`/api/import/${currentProfile.id}/pdf`, {
    method: 'POST',
    body: formData
  });
  const data = await res.json();
  showImportResult(data);
}

function showImportResult(data) {
  const resultDiv = document.getElementById('import-result');
  const contentDiv = document.getElementById('import-result-content');
  resultDiv.style.display = 'block';

  if (data.error) {
    contentDiv.innerHTML = `<p style="color:var(--red)">${data.error}</p>${data.details ? `<p style="color:var(--text2);font-size:11px">${data.details}</p>` : ''}`;
    return;
  }

  contentDiv.innerHTML = `
    <div class="stat-row">
      <div class="stat-box"><div class="value">${data.accountsFound}</div><div class="label">Accounts Found</div></div>
      <div class="stat-box"><div class="value">${data.accountsImported}</div><div class="label">Imported</div></div>
      <div class="stat-box"><div class="value">${data.totalAccounts}</div><div class="label">Total in Profile</div></div>
    </div>
    ${data.bureau ? `<p style="color:var(--accent);font-size:11px;margin-top:8px">Detected bureau: ${data.bureau}</p>` : ''}
    ${data.personalInfo?.name ? `<p style="color:var(--text2);font-size:11px">Name detected: ${data.personalInfo.name}</p>` : ''}
    ${data.errors?.length > 0 ? `<p style="color:var(--orange);font-size:11px;margin-top:8px">${data.errors.join(' | ')}</p>` : ''}
    <p style="color:var(--green);margin-top:12px;font-size:12px">Import complete. Go to Dashboard and run a Full Scan to analyze your accounts.</p>
    <button class="primary mt-8" onclick="runFullScan();document.querySelector('[data-tab=dashboard]').click()">Run Full Scan Now</button>
  `;

  // Refresh profile data
  refreshProfile();
}

async function refreshProfile() {
  const res = await fetch(`/api/profiles/${currentProfile.id}`);
  currentProfile = await res.json();
}

// ─── Dashboard ──────────────────────────────────────────────────────────────
function renderDashboard() {
  const m = document.getElementById('main-content');
  const scores = currentProfile?.scores || [];
  const latestScores = getLatestScores(scores);

  m.innerHTML = `
    <div class="module-header"><div class="icon">◈</div><div><h2>ADVISORY FEED</h2><span style="color:var(--text2);font-size:11px">${currentProfile?.firstName} ${currentProfile?.lastName} — ${currentProfile?.state}</span></div></div>

    ${scores.length > 0 ? `<div class="score-display">
      ${Object.entries(latestScores).map(([bureau, score]) => `
        <div class="score-gauge ${score >= 680 ? 'good' : score >= 580 ? 'fair' : 'poor'}">
          <div class="number">${score}</div>
          <div class="label">${bureau}</div>
        </div>`).join('')}
    </div>` : '<p style="color:var(--text2);margin-bottom:16px">Add scores in the Profile tab to see your score display.</p>'}

    <div class="stat-row">
      <div class="stat-box"><div class="value">${advisories.length}</div><div class="label">Active Advisories</div></div>
      <div class="stat-box"><div class="value">${advisories.filter(a=>a.priority==='critical').length}</div><div class="label">Critical</div></div>
      <div class="stat-box"><div class="value">${currentProfile?.accounts?.length || 0}</div><div class="label">Accounts</div></div>
      <div class="stat-box"><div class="value">${scanResults?.estimatedTotalImpact || 'Run scan'}</div><div class="label">Estimated Impact</div></div>
    </div>

    <h3 class="mt-12 mb-8">YOUR MOVES — Priority Order</h3>
    <div id="advisory-feed">
      ${advisories.length === 0 ? '<p style="color:var(--text2)">Add accounts and scores in the Profile tab, then run a scan to get personalized advisories.</p>' : ''}
      ${advisories.slice(0, 20).map(a => `
        <div class="advisory-item ${a.priority}">
          <div class="condition">${a.condition}</div>
          <div class="action">${a.action}</div>
          <div class="impact">${a.expectedImpact}</div>
          <div class="meta">
            <span>${a.module.replace(/_/g,' ')}</span>
            <span>${a.bureau}</span>
            <span>${a.timeframe}</span>
          </div>
        </div>`).join('')}
    </div>

    <button class="primary mt-12" onclick="runFullScan()">Re-Run Full Scan</button>
  `;
}

async function runFullScan() {
  const res = await fetch(`/api/modules/${currentProfile.id}/scan`, { method: 'POST' });
  scanResults = await res.json();
  advisories = scanResults.advisories || [];
  renderDashboard();
}

// ─── Profile Tab ────────────────────────────────────────────────────────────
function renderProfile() {
  const m = document.getElementById('main-content');
  const accounts = currentProfile?.accounts || [];
  const scores = currentProfile?.scores || [];

  m.innerHTML = `
    <div class="module-header"><div class="icon">⊕</div><div><h2>CREDIT PROFILE</h2><span style="color:var(--text2);font-size:11px">${currentProfile?.firstName} ${currentProfile?.lastName}</span></div></div>

    <div class="card">
      <h3>Add Score</h3>
      <div class="form-row inline mt-8">
        <div><label>Bureau</label><select id="score-bureau"><option value="equifax">Equifax</option><option value="experian">Experian</option><option value="transunion">TransUnion</option></select></div>
        <div><label>Score</label><input id="score-value" type="number" placeholder="642"></div>
        <div><label>Date</label><input id="score-date" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
        <div style="display:flex;align-items:flex-end"><button class="primary" onclick="addScore()">Add</button></div>
      </div>
    </div>

    <div class="card">

async function addScore() {
  const bureau = document.getElementById('score-bureau').value;
  const score = document.getElementById('score-value').value;
  const date = document.getElementById('score-date').value;
  if (!score) return;
  const res = await fetch(`/api/profiles/${currentProfile.id}/scores`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ bureau, score: Number(score), recordedAt: date })
  });
  if (res.ok) {
    const entry = await res.json();
    currentProfile.scores.push(entry);
    renderProfile();
  }
}

async function addAccount() {
  const body = {
    creditorName: document.getElementById('acct-creditor').value,
    accountNumber: document.getElementById('acct-number').value,
    accountType: document.getElementById('acct-type').value,
    accountStatus: document.getElementById('acct-status').value,
    bureau: document.getElementById('acct-bureau').value,
    balance: document.getElementById('acct-balance').value || null,
    creditLimit: document.getElementById('acct-limit').value || null,
    snapshotDate: document.getElementById('acct-snapshot').value || null,
    dateOpened: document.getElementById('acct-opened').value || null,
    monthlyPayment: document.getElementById('acct-payment').value || null,
    lastTransactionDate: document.getElementById('acct-lasttx').value || null,
    isNegative: document.getElementById('acct-negative').value === 'true',
    negativeReason: document.getElementById('acct-reason').value || null,
    isMedical: document.getElementById('acct-medical').value === 'true',
    isAuthorizedUser: document.getElementById('acct-au').value === 'true',
    primaryHolderName: document.getElementById('acct-primary').value || null,
    collectionAgency: document.getElementById('acct-collector').value || null,
  };
  if (!body.creditorName) return;
  const res = await fetch(`/api/profiles/${currentProfile.id}/accounts`, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (res.ok) {
    const acct = await res.json();
    currentProfile.accounts.push(acct);
    renderProfile();
  }
}

// ─── Helpers ────────────────────────────────────────────────────────────────
function getLatestScores(scores) {
  const latest = {};
  for (const s of scores) {
    if (!latest[s.bureau] || new Date(s.recordedAt) > new Date(latest[s.bureau].recordedAt)) {
      latest[s.bureau] = s;
    }
  }
  const result = {};
  for (const [bureau, entry] of Object.entries(latest)) {
    result[bureau] = entry.score;
  }
  return result;
}

// ─── Skip onboarding if profile exists (reload) ─────────────────────────────
async function checkExistingProfile() {
  const res = await fetch('/api/profiles');
  const profiles = await res.json();
  if (profiles.length > 0) {
    currentProfile = profiles[0];
    document.getElementById('onboarding').style.display = 'none';
    document.getElementById('main-nav').style.display = 'flex';
    document.getElementById('main-content').style.display = 'block';
    // Load advisories
    const advRes = await fetch(`/api/modules/${currentProfile.id}/advisories`);
    advisories = await advRes.json();
    renderDashboard();
  }
}
